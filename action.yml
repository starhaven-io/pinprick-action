name: pinprick-action
description: Audit your GitHub Actions supply chain security with pinprick

branding:
  icon: star
  color: purple

inputs:
  version:
    description: pinprick version to install. Defaults to "0.22.0", the version this action release pins, so pinned runs stay deterministic. Use "latest" for the newest release, or an exact version like "v0.22.0".
    required: false
    default: "0.22.0"
  path:
    description: Repository path to scan.
    required: false
    default: "."
  advanced-security:
    description: Upload SARIF results to GitHub code scanning.
    required: false
    default: "true"
  fail-on-findings:
    description: Fail the workflow when pinprick reports findings.
    required: false
    default: "false"
  strict-provenance:
    description: Fail instead of warn when the pinprick archive's provenance attestation cannot be verified (gh missing or too old, no GitHub token, or a pinprick release that predates attestations). Recommended on self-hosted runners.
    required: false
    default: "false"
  no-repo-config:
    description: Ignore the scanned repository's .pinprick.toml and audit with the global config or defaults. Use when auditing repositories you do not control, so their config cannot suppress findings.
    required: false
    default: "false"

outputs:
  exit-code:
    description: pinprick audit exit code.
    value: ${{ steps.run-pinprick.outputs.exit-code }}
  sarif-file:
    description: Filepath to usable pinprick SARIF results when advanced-security is enabled and the audit exits 0 or 1.
    value: ${{ steps.run-pinprick.outputs.sarif-file }}

runs:
  using: composite
  steps:
    - name: Run pinprick
      id: run-pinprick
      run: |
        "${GITHUB_ACTION_PATH}/action.sh"
      env:
        # PPA_* carry this wrapper's inputs, namespaced to avoid clashing with
        # pinprick's own environment variables.
        PPA_VERSION: ${{ inputs.version }}
        PPA_PATH: ${{ inputs.path }}
        PPA_ADVANCED_SECURITY: ${{ inputs.advanced-security }}
        PPA_FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        PPA_STRICT_PROVENANCE: ${{ inputs.strict-provenance }}
        PPA_NO_REPO_CONFIG: ${{ inputs.no-repo-config }}
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash -euo pipefail {0}

    - name: Upload SARIF file to GitHub code scanning
      if: ${{ inputs.advanced-security == 'true' }}
      uses: github/codeql-action/upload-sarif@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
      with:
        sarif_file: ${{ steps.run-pinprick.outputs.sarif-file }}
        category: pinprick

    - name: Fail on pinprick findings
      if: ${{ inputs.fail-on-findings == 'true' && steps.run-pinprick.outputs.exit-code == '1' }}
      run: |
        echo "::error::pinprick audit found workflow security findings"
        exit 1
      shell: bash -euo pipefail {0}
