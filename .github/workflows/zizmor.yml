name: zizmor

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "action.yml"
  schedule:
    - cron: "30 13 * * 1"
  workflow_dispatch:

concurrency:
  group: "zizmor-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  zizmor:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-zizmor.yml@051b9480eed0962e5639830ac3ef06528b3b899c # v2026.11.22.1
    with:
      timeout-minutes: 10
