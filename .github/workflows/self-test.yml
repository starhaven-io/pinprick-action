name: Self-test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: "self-test-${{ github.ref }}"
  cancel-in-progress: true

defaults:
  run:
    shell: bash -xeuo pipefail {0}

permissions: {}

jobs:
  validate:
    name: Validate wrapper
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate action metadata
        run: ruby -e 'require "yaml"; YAML.load_file("action.yml"); puts "action.yml OK"'

      - name: Validate README version and pins
        run: |
          ruby - <<'RUBY'
          require "open3"
          require "yaml"

          action = YAML.load_file("action.yml")
          default_version = action.fetch("inputs").fetch("version").fetch("default")
          readme = File.read("README.md", encoding: "UTF-8")

          version_row = /^\|\s*`version`\s*\|\s*`#{Regexp.escape(default_version)}`\s*\|/
          abort("README inputs table does not match action.yml version default #{default_version}") unless readme.match?(version_row)

          pins = readme.scan(%r{uses:\s+starhaven-io/pinprick-action@([0-9a-f]{40})\s+#\s+(v[0-9]+\.[0-9]+\.[0-9]+)})
          abort("README does not contain pinned pinprick-action examples") if pins.empty?

          pins.each do |sha, tag|
            resolved, status = Open3.capture2("git", "rev-parse", "#{tag}^{}")
            abort("could not resolve README tag #{tag}") unless status.success?

            resolved = resolved.strip
            next if resolved == sha

            abort("README pin mismatch for #{tag}: #{sha} != #{resolved}")
          end

          puts "README version and pins OK"
          RUBY

      - name: Check shell syntax
        run: |
          shopt -s nullglob
          bash -n action.sh test/*.sh

      - name: ShellCheck
        run: |
          shopt -s nullglob
          command -v shellcheck >/dev/null 2>&1 || {
            echo "::error::shellcheck is not installed on this runner"
            exit 1
          }
          shellcheck action.sh test/*.sh

      - name: Assert failure paths annotate
        run: ./test/failure-annotations.sh

      - name: Assert strict provenance behavior
        run: ./test/strict-provenance.sh

      - name: Assert no-repo-config behavior
        run: ./test/no-repo-config.sh

  # Every runner label README lists as supported. Keep the two in step: a
  # label belongs in one of these matrices or it does not belong in the table.
  console:
    name: Console mode (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - ubuntu-24.04
          - ubuntu-slim
          - ubuntu-24.04-arm
          - macos-latest
          - macos-15
          - macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run local pinprick action
        id: run_pinprick
        uses: ./
        with:
          advanced-security: false
          fail-on-findings: false
          path: .

      - name: Assert clean exit code
        env:
          EXIT_CODE: ${{ steps.run_pinprick.outputs['exit-code'] }}
        run: test "${EXIT_CODE}" = "0"

  # Public-preview images, held out of the required conclusion check so an
  # image that is unavailable or in flux cannot block every pull request.
  console_preview:
    name: Console mode (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-26.04
          - ubuntu-26.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run local pinprick action
        id: run_pinprick
        uses: ./
        with:
          advanced-security: false
          fail-on-findings: false
          path: .

      - name: Assert clean exit code
        env:
          EXIT_CODE: ${{ steps.run_pinprick.outputs['exit-code'] }}
        run: test "${EXIT_CODE}" = "0"

  contract:
    name: Exit-code contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create findings fixture
        id: fixture
        run: |
          fixture="${RUNNER_TEMP}/pinprick-findings"
          workflow="${fixture}/.github/workflows/runtime-fetch.yml"
          mkdir -p "$(dirname "${workflow}")"

          fetch_tool="cur""l"
          pipe="|"
          {
            printf '%s\n' \
              "name: Runtime fetch fixture" \
              "on: pull_request" \
              "jobs:" \
              "  runtime-fetch:" \
              "    runs-on: ubuntu-24.04" \
              "    steps:"
            printf '      - run: %s -fsSL https://example.com/install.sh %s bash\n' "${fetch_tool}" "${pipe}"
          } > "${workflow}"

          printf 'path=%s\n' "${fixture}" >> "${GITHUB_OUTPUT}"

      - name: Findings succeed by default
        id: findings_default
        uses: ./
        with:
          advanced-security: false
          fail-on-findings: false
          path: ${{ steps.fixture.outputs.path }}

      - name: Assert findings default behavior
        env:
          OUTCOME: ${{ steps.findings_default.outcome }}
          EXIT_CODE: ${{ steps.findings_default.outputs['exit-code'] }}
        run: |
          test "${OUTCOME}" = "success"
          test "${EXIT_CODE}" = "1"

      - name: Findings fail when requested
        id: findings_fail
        continue-on-error: true
        uses: ./
        with:
          advanced-security: false
          fail-on-findings: true
          path: ${{ steps.fixture.outputs.path }}

      - name: Assert fail-on-findings behavior
        env:
          OUTCOME: ${{ steps.findings_fail.outcome }}
        run: test "${OUTCOME}" = "failure"

      - name: Create repo-config fixture
        id: repo_config_fixture
        env:
          SOURCE_FIXTURE: ${{ steps.fixture.outputs.path }}
        run: |
          fixture="${RUNNER_TEMP}/pinprick-repo-config"
          mkdir -p "${fixture}"
          cp -R "${SOURCE_FIXTURE}/." "${fixture}/"
          cat > "${fixture}/.pinprick.toml" <<'TOML'
          [ignore]
          patterns = ["piped to shell"]
          TOML
          printf 'path=%s\n' "${fixture}" >> "${GITHUB_OUTPUT}"

      - name: Repository config suppresses findings
        id: findings_with_repo_config
        uses: ./
        with:
          advanced-security: false
          fail-on-findings: false
          path: ${{ steps.repo_config_fixture.outputs.path }}

      - name: Assert repository config behavior
        env:
          OUTCOME: ${{ steps.findings_with_repo_config.outcome }}
          EXIT_CODE: ${{ steps.findings_with_repo_config.outputs['exit-code'] }}
        run: |
          test "${OUTCOME}" = "success"
          test "${EXIT_CODE}" = "0"

      - name: No-repo-config restores suppressed finding
        id: findings_no_repo_config
        uses: ./
        with:
          advanced-security: false
          fail-on-findings: false
          no-repo-config: true
          path: ${{ steps.repo_config_fixture.outputs.path }}

      - name: Assert repository config was ignored
        env:
          OUTCOME: ${{ steps.findings_no_repo_config.outcome }}
          EXIT_CODE: ${{ steps.findings_no_repo_config.outputs['exit-code'] }}
        run: |
          test "${OUTCOME}" = "success"
          test "${EXIT_CODE}" = "1"

      - name: Invalid version fails
        id: invalid_version
        continue-on-error: true
        uses: ./
        with:
          version: invalid
          advanced-security: false
          fail-on-findings: false
          path: .

      - name: Assert invalid version behavior
        env:
          OUTCOME: ${{ steps.invalid_version.outcome }}
        run: test "${OUTCOME}" = "failure"

      - name: Create empty fixture
        id: empty_fixture
        run: |
          fixture="${RUNNER_TEMP}/pinprick-empty"
          mkdir -p "${fixture}"
          printf 'path=%s\n' "${fixture}" >> "${GITHUB_OUTPUT}"

      - name: Engine error fails
        id: engine_error
        continue-on-error: true
        uses: ./
        with:
          advanced-security: true
          fail-on-findings: false
          path: ${{ steps.empty_fixture.outputs.path }}

      - name: Assert engine error behavior
        env:
          OUTCOME: ${{ steps.engine_error.outcome }}
          EXIT_CODE: ${{ steps.engine_error.outputs['exit-code'] }}
          SARIF_FILE: ${{ steps.engine_error.outputs['sarif-file'] }}
        run: |
          test "${OUTCOME}" = "failure"
          test "${EXIT_CODE}" = "2"
          test -z "${SARIF_FILE}"

  sarif:
    name: SARIF mode
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # advanced-security uploads pinprick SARIF to code scanning
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run local pinprick action
        id: run_pinprick
        uses: ./
        with:
          advanced-security: true
          fail-on-findings: false
          path: .

      - name: Assert SARIF content and output
        env:
          SARIF_FILE: ${{ steps.run_pinprick.outputs['sarif-file'] }}
        run: |
          test -n "${SARIF_FILE}"
          test -s "${SARIF_FILE}"
          jq -e '.runs[0].tool.driver.name == "pinprick"' "${SARIF_FILE}"
          jq -e '(.runs[0].results | type) == "array"' "${SARIF_FILE}"

  conclusion:
    name: conclusion
    # console_preview is deliberately absent: preview images report but do not
    # gate. needs.console.result aggregates every leg of that matrix.
    needs: [validate, console, contract, sarif]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    if: always()
    steps:
      - name: Result
        env:
          VALIDATE: ${{ needs.validate.result }}
          CONSOLE: ${{ needs.console.result }}
          CONTRACT: ${{ needs.contract.result }}
          SARIF: ${{ needs.sarif.result }}
        run: |
          test "${VALIDATE}" = "success"
          test "${CONSOLE}" = "success"
          test "${CONTRACT}" = "success"
          [[ "${SARIF}" == "success" || "${SARIF}" == "skipped" ]]
