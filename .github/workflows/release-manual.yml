name: Release (manual)

# Wrapper-only changes need an explicit release: release.yml publishes only
# validated starhaven-bot engine bumps. See RELEASING.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to create, e.g. v0.6.0
        required: true
        type: string
      notes:
        description: One-line summary of the wrapper changes in this release
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  release:
    name: Release wrapper changes
    runs-on: ubuntu-slim
    timeout-minutes: 25
    environment:
      name: release
      deployment: false
    permissions:
      actions: read # required to wait for the released commit's Self-test workflow run
      contents: read # required to validate the release source and release history
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate release request
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES: ${{ inputs.notes }}
          REF: ${{ github.ref }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.version }}
        run: |
          if [[ "${REF}" != "refs/heads/main" ]]; then
            echo "::error::Releases are cut from main, not ${REF}"
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::'version' must be a canonical tag like v0.6.0"
            exit 1
          fi

          if [[ -z "${NOTES//[[:space:]]/}" || "${NOTES}" == *$'\n'* || "${NOTES}" == *$'\r'* ]]; then
            echo "::error::'notes' must be a non-empty single-line summary"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Tag ${TAG} already exists"
            exit 1
          fi

          RELEASE_TAGS=$(
            gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name'
          )
          LATEST_TAG=$(
            printf '%s\n' "${RELEASE_TAGS}" \
              | grep -E '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$' \
              | sort -V \
              | tail -1 || true
          )
          if [[ -n "${LATEST_TAG}" ]]; then
            HIGHEST=$(printf '%s\n%s\n' "${LATEST_TAG}" "${TAG}" | sort -V | tail -1)
            if [[ "${HIGHEST}" != "${TAG}" ]]; then
              echo "::error::${TAG} does not sort above the latest release ${LATEST_TAG}"
              exit 1
            fi
          fi

          ENGINE_VERSION=$(python3 - <<'PY'
          import re
          from pathlib import Path

          action = Path("action.yml").read_text(encoding="utf-8")
          # Manual wrapper releases intentionally follow action.sh's
          # stable-version-only input contract.
          pattern = re.compile(
              r'(?ms)^inputs:\n(?:(?!^\S).)*?^  version:\n'
              r'(?:    [^\n]*\n)*?^    default: "'
              r'((?:0|[1-9][0-9]*)\.'
              r'(?:0|[1-9][0-9]*)\.'
              r'(?:0|[1-9][0-9]*))"$'
          )
          match = pattern.search(action)
          if not match:
              raise SystemExit("could not find a SemVer version default in action.yml")
          print(match.group(1))
          PY
          )

          echo "engine_version=${ENGINE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Wait for released commit self-test
        env:
          COMMIT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: .github/scripts/wait-for-self-test.sh

      - name: Mint release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      - name: Create action tag and release
        # Let gh create the tag at the validated commit. --verify-tag would
        # require a pre-existing tag and reintroduce stranded-tag recovery.
        env:
          COMMIT_SHA: ${{ github.sha }}
          ENGINE_VERSION: ${{ steps.request.outputs.engine_version }}
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          NOTES: ${{ inputs.notes }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ inputs.version }}
        run: |
          gh release create "${TAG}" \
            --repo "${REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --fail-on-no-commits \
            --title "${TAG}" \
            --notes "${NOTES}

          Pins pinprick ${ENGINE_VERSION} as the default engine version."
