name: CodeQL

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "action.yml"
      - ".github/scripts/**"
      - "test/**"
      - "Gemfile"
      - "Gemfile.lock"
      - ".ruby-version"
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:

concurrency:
  group: "codeql-${{ github.ref }}"
  cancel-in-progress: false

permissions: {}

jobs:
  analyze:
    name: Analyze
    permissions:
      contents: read
      security-events: write # required to upload SARIF results
    uses: starhaven-io/.github/.github/workflows/reusable-codeql.yml@77467585a669227a235d6660c7331487acb916aa # v2026.10.10.3
    with:
      languages: '["actions","ruby"]'
      runner: "ubuntu-slim"
      timeout-minutes: 10
      build-mode: ""
      build-profile: ""
