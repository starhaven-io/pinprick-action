version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
    groups:
      "bundler-dependencies":
        patterns:
          - "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    cooldown:
      default-days: 7
      exclude:
        - "starhaven-io/*"
        # A new Ruby is unusable until setup-ruby knows it exists, so a
        # cooldown here delays every Ruby bump for no safety.
        - "ruby/setup-ruby"
    ignore:
      # Fleet pins are owned by the sync; Dependabot never writes them.
      - dependency-name: "starhaven-io/.github/*"
      # 4.38.3 and later bundle apache-arrow code generation that pinprick cannot verify; reassess with https://github.com/github/codeql-action/issues/4252
      - dependency-name: "github/codeql-action/*"
        versions:
          - ">=4.38.3"
    groups:
      "github-actions":
        patterns:
          - "*"
